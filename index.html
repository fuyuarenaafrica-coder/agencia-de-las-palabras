<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Agencia de las Palabras</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#17233d;background:#eef2fb}*{box-sizing:border-box}body{margin:0}.app{max-width:950px;margin:auto;padding:20px}header{background:#182447;color:white;border-radius:20px;padding:24px}h1{margin:4px 0;font-size:clamp(25px,4vw,38px)}.tag{color:#a9f0d5;font-weight:700;letter-spacing:2px}.panel{background:white;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #18244713}.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.mission{border:2px solid #d9e0f0;border-radius:14px;padding:16px;background:#f8faff;text-align:left;color:#17233d}.mission:disabled{opacity:.45}.mission:not(:disabled){cursor:pointer}.mission strong{display:block;font-size:18px}.mission small{display:block;margin-top:6px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#4e3ec8;color:white;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.secondary{background:#e9e8ff;color:#28206c}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.option{padding:16px;background:#f5f7ff;border:2px solid #d5dbed;border-radius:12px;cursor:pointer;font-weight:700;font-size:17px;color:#17233d}.option.selected{border-color:#4e3ec8;background:#e7e3ff}.option.correct{border-color:#17885a;background:#dcf8e9}.option.wrong{border-color:#bd3434;background:#ffe6e6}.word{font-size:clamp(34px,7vw,56px);text-align:center;font-weight:800;color:#3525a0;margin:22px 0}.hint{background:#edf8f3;border-left:5px solid #20a579;padding:12px;border-radius:8px}.feedback{padding:14px;border-radius:12px;margin:12px 0;background:#eef2fb}.feedback.ok{background:#def6e9}.feedback.no{background:#fff0dd}.bar{height:12px;background:#e4e8f4;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#20a579;transition:width .2s}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#596680}button:focus-visible{outline:3px solid #f5a623;outline-offset:2px}@media(max-width:520px){.options{grid-template-columns:1fr}.app{padding:10px}.panel{padding:17px}}.multi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.multi-group{background:#f6f8ff;border:1px solid #dbe1f0;border-radius:12px;padding:12px}.multi-group h3{font-size:15px;margin:0 0 9px}.multi-choices{display:flex;gap:8px;flex-wrap:wrap}.multi-choice{flex:1;min-width:85px;border:2px solid #d6dcef;background:white;border-radius:10px;padding:11px 7px;font-weight:700;color:#17233d;cursor:pointer}.multi-choice.selected{background:#e8e3ff;border-color:#4e3ec8}.multi-choice.correct{background:#dcf8e9;border-color:#17885a}.multi-choice.wrong{background:#ffe6e6;border-color:#bd3434}.multi-choice:disabled{cursor:default}.note{font-size:13px;color:#596680;margin-top:6px}@media(max-width:650px){.multi-grid{grid-template-columns:1fr}}</style></head><body><main class="app"><header><div class="tag">ARCHIVO DE LENGUA · 1.º ESO</div><h1>🕵️ La Agencia de las Palabras</h1><div>Investiga cada palabra y completa los cinco expedientes y el desafío final.</div></header><section class="panel" id="screen"></section></main><script>
const missions=[
{name:'01 · Género y número',desc:'Dos características a la vez',tip:'Fíjate en el artículo que acompaña a la palabra y en si nombra uno o varios. Algunas palabras terminan en -s y son singulares, como «el lunes».',items:[['actrices','Femenino · Plural','Las actrices: femenino y plural.'],['crisis','Femenino · Singular','La crisis: femenino y singular.'],['lápices','Masculino · Plural','Los lápices: masculino y plural.'],['paraguas','Masculino · Singular','El paraguas: masculino y singular.'],['análisis','Masculino · Singular','El análisis: masculino y singular.'],['especies','Femenino · Plural','Las especies: femenino y plural.'],['lunes','Masculino · Singular','El lunes: masculino y singular.'],['víveres','Masculino · Plural','Los víveres: masculino y plural.'],['tesis','Femenino · Singular','La tesis: femenino y singular.'],['jabalíes','Masculino · Plural','Los jabalíes: masculino y plural.']],opts:['Masculino · Singular','Masculino · Plural','Femenino · Singular','Femenino · Plural']},
{name:'02 · Identidad',desc:'Común, antropónimo y topónimo',tip:'Común: nombra en general. Antropónimo: nombre propio de persona. Topónimo: nombre propio de lugar.',items:[['archipiélago','Común','Archipiélago es un nombre común.'],['Lanzarote','Topónimo','Lanzarote es un nombre propio de lugar.'],['Aitana','Antropónimo','Aitana es un nombre propio de persona.'],['cordillera','Común','Cordillera es un nombre común.'],['Guayadeque','Topónimo','Guayadeque es un topónimo.'],['Irene','Antropónimo','Irene es un antropónimo.'],['océano','Común','Océano es un nombre común.'],['Tenerife','Topónimo','Tenerife es un topónimo.'],['Alejandro','Antropónimo','Alejandro es un antropónimo.'],['municipio','Común','Municipio es un nombre común.']],opts:['Común','Antropónimo','Topónimo']},
{name:'03 · Lo que nombran',desc:'Concreto y abstracto',tip:'Concreto: nombra algo que podemos percibir con los sentidos. Abstracto: nombra sentimientos, ideas o cualidades.',items:[['valentía','Abstracto','La valentía es una cualidad.'],['brújula','Concreto','Una brújula se puede percibir.'],['nostalgia','Abstracto','La nostalgia es un sentimiento.'],['relámpago','Concreto','Un relámpago puede verse.'],['justicia','Abstracto','La justicia es una idea o valor.'],['murmullo','Concreto','Un murmullo se puede oír.'],['paciencia','Abstracto','La paciencia es una cualidad.'],['aroma','Concreto','Un aroma se puede oler.'],['libertad','Abstracto','La libertad es una idea.'],['escalera','Concreto','Una escalera se puede percibir.']],opts:['Concreto','Abstracto']},
{name:'04 · Cantidades',desc:'Contable e incontable',tip:'Contable: podemos contar unidades. Incontable: hablamos de cantidades o medidas. Por ejemplo, «dos botellas de aceite» cuenta botellas, no el aceite.',items:[['equipajes','Contable','Podemos contar equipajes: un equipaje, dos equipajes.'],['harina','Incontable','La harina se mide o pesa.'],['monedas','Contable','Podemos contar monedas.'],['oxígeno','Incontable','El oxígeno se mide, no se cuenta directamente por unidades.'],['noticias','Contable','Podemos contar noticias.'],['arena','Incontable','La arena se mide o pesa.'],['instrumentos','Contable','Podemos contar instrumentos.'],['aceite','Incontable','El aceite se mide por cantidad.'],['fotografías','Contable','Podemos contar fotografías.'],['azúcar','Incontable','El azúcar se mide o pesa.']],opts:['Contable','Incontable']},
{name:'05 · Uno o conjunto',desc:'Individual y colectivo',tip:'Colectivo: en singular nombra un conjunto. Individual: nombra un ser u objeto, aunque esté en plural.',items:[['enjambre','Colectivo','Enjambre nombra un conjunto de abejas.'],['abejas','Individual','Abejas está en plural, pero no es un nombre colectivo.'],['archipiélago','Colectivo','Archipiélago nombra un conjunto de islas.'],['islas','Individual','Islas es plural de un nombre individual.'],['biblioteca','Colectivo','En este juego, biblioteca nombra una colección de libros.'],['libros','Individual','Libros es plural, no un nombre colectivo.'],['orquesta','Colectivo','Orquesta nombra un conjunto de músicos.'],['músicos','Individual','Músicos es plural de un nombre individual.'],['flota','Colectivo','Flota nombra un conjunto de barcos.'],['barcos','Individual','Barcos es plural de un nombre individual.']],opts:['Individual','Colectivo']}
];
const finalWords=[
{word:'enjambre',answers:['Común','Concreto','Contable','Colectivo','Masculino','Singular'],why:'El enjambre: conjunto de abejas. Podemos contar enjambres.'},
{word:'brújulas',answers:['Común','Concreto','Contable','Individual','Femenino','Plural'],why:'Las brújulas: objetos contables; plural no significa colectivo.'},
{word:'nostalgia',answers:['Común','Abstracto',null,null,'Femenino','Singular'],why:'La nostalgia nombra un sentimiento; las categorías de cantidad y agrupación no son pertinentes en este ejercicio.'},
{word:'archipiélagos',answers:['Común','Concreto','Contable','Colectivo','Masculino','Plural'],why:'Los archipiélagos: cada archipiélago es un conjunto de islas, aunque la palabra esté en plural.'},
{word:'oxígeno',answers:['Común','Concreto','Incontable',null,'Masculino','Singular'],why:'El oxígeno es una sustancia que se puede medir; individual/colectivo no se aplica aquí.'},
{word:'orquesta',answers:['Común','Concreto','Contable','Colectivo','Femenino','Singular'],why:'La orquesta es un conjunto de músicos y se pueden contar orquestas.'},
{word:'actrices',answers:['Común','Concreto','Contable','Individual','Femenino','Plural'],why:'Las actrices: plural de un sustantivo individual; no es colectivo.'},
{word:'paciencia',answers:['Común','Abstracto',null,null,'Femenino','Singular'],why:'La paciencia es una cualidad abstracta.'},
{word:'flotas',answers:['Común','Concreto','Contable','Colectivo','Femenino','Plural'],why:'Las flotas: conjuntos de barcos. Un sustantivo colectivo también puede estar en plural.'},
{word:'paraguas',answers:['Común','Concreto','Contable','Individual','Masculino','Singular'],why:'El paraguas: masculino singular aunque termine en -s.'},
{word:'justicia',answers:['Común','Abstracto',null,null,'Femenino','Singular'],why:'La justicia nombra una idea o valor.'},
{word:'lápices',answers:['Común','Concreto','Contable','Individual','Masculino','Plural'],why:'Los lápices son objetos contables. Plural no equivale a colectivo.'},
{word:'rebaños',answers:['Común','Concreto','Contable','Colectivo','Masculino','Plural'],why:'Los rebaños: cada rebaño nombra un conjunto de animales.'},
{word:'harina',answers:['Común','Concreto','Incontable',null,'Femenino','Singular'],why:'La harina es una sustancia que se mide o pesa.'},
{word:'murmullo',answers:['Común','Concreto','Contable','Individual','Masculino','Singular'],why:'El murmullo se percibe por el oído; podemos hablar de varios murmullos.'},
{word:'especies',answers:['Común','Concreto','Contable','Individual','Femenino','Plural'],why:'Las especies: femenino plural; la palabra no designa por sí misma un conjunto.'},
{word:'Alejandro',answers:['Propio','Concreto',null,null,'Masculino','Singular'],why:'Alejandro es un antropónimo; no se aplican aquí las categorías de cantidad o agrupación.'},
{word:'Tenerife',answers:['Propio','Concreto',null,null,'Femenino','Singular'],why:'Tenerife es un topónimo; se dice «la isla de Tenerife».'},
{word:'músicos',answers:['Común','Concreto','Contable','Individual','Masculino','Plural'],why:'Los músicos: aunque haya varios, es un nombre individual en plural.'},
{word:'valentía',answers:['Común','Abstracto',null,null,'Femenino','Singular'],why:'La valentía nombra una cualidad.'}
];
const groups=[['Común','Propio'],['Concreto','Abstracto'],['Contable','Incontable'],['Individual','Colectivo'],['Masculino','Femenino'],['Singular','Plural']];
let multiSelected={};
let unlocked=Number(sessionStorage.getItem('sust_unlocked')||0),stage=-1,index=0,selected=null,checked=false,score=0;const el=document.getElementById('screen');function renderHome(){stage=-1;el.innerHTML='<h2>Expedientes de clasificación</h2><p class="muted">Resuelve cada expediente para desbloquear el siguiente. Puedes repetir los que ya hayas completado.</p><div class="missions">'+[...missions,{name:'06 · Expediente maestro',desc:'Clasificación completa'}].map((m,i)=>`<button class="mission" ${i>unlocked?'disabled':''} onclick="start(${i})"><strong>${i>unlocked?'🔒':'📂'} ${m.name}</strong><small>${m.desc}</small></button>`).join('')+'</div><p class="muted">Sin cronómetro. Lee la pista cuando la necesites.</p>'}function start(i){stage=i;index=0;selected=null;checked=false;score=0;multiSelected={};if(i===missions.length)renderFinal();else render()}function render(){const m=missions[stage],q=m.items[index];el.innerHTML=`<div class="toprow"><button class="btn secondary" onclick="renderHome()">← Expedientes</button><strong>${m.name}</strong><span class="muted">${index+1} de ${m.items.length}</span></div><div class="bar" style="margin-top:15px"><div style="width:${index/m.items.length*100}%"></div></div><h2>${m.desc}</h2><div class="hint"><strong>🔎 Pista de investigación</strong><div>${m.tip}</div></div><p class="muted" style="text-align:center;margin-top:24px">Clasifica el sustantivo:</p><div class="word">${q[0]}</div><div class="options">${m.opts.map(o=>`<button class="option ${selected===o?'selected':''} ${checked?(o===q[1]?'correct':selected===o?'wrong':''):''}" onclick="pick('${o}')" ${checked?'disabled':''}>${o}</button>`).join('')}</div><div id="result">${checked?`<div class="feedback ${selected===q[1]?'ok':'no'}"><strong>${selected===q[1]?'✓ Correcto':'↻ Revisa la clasificación'}</strong><div>${q[2]}</div></div>`:''}</div><div class="toprow"><span class="muted">Aciertos: ${score}</span>${checked?`<button class="btn" onclick="next()">${index===m.items.length-1?'Terminar expediente':'Siguiente palabra →'}</button>`:`<button class="btn" onclick="check()" ${selected===null?'disabled':''}>Comprobar</button>`}</div>`}function pick(o){if(checked)return;selected=o;render()}function check(){if(selected===null)return;checked=true;if(selected===missions[stage].items[index][1])score++;render()}function renderFinal(){const q=finalWords[index];let html=`<div class="toprow"><button class="btn secondary" onclick="renderHome()">← Expedientes</button><strong>07 · Expediente maestro</strong><span class="muted">${index+1} de ${finalWords.length}</span></div><div class="bar" style="margin-top:15px"><div style="width:${index/finalWords.length*100}%"></div></div><h2>Clasificación completa · Nivel ${Math.floor(index/5)+1} de 4</h2><div class="hint">🔎 Elige <strong>una opción por categoría</strong>. Si una categoría no corresponde a la palabra, marca <strong>No se aplica</strong>.</div><div class="word">${q.word}</div><div class="multi-grid">`;
for(let g=0;g<groups.length;g++){const opts=['No se aplica',...groups[g]];html+=`<div class="multi-group"><h3>${['Identidad','Lo que nombra','Cantidad','Uno o conjunto','Género','Número'][g]}</h3><div class="multi-choices">${opts.map(o=>`<button class="multi-choice ${multiSelected[g]===o?'selected':''} ${checked?(o===(q.answers[g]??'No se aplica')?'correct':multiSelected[g]===o?'wrong':''):''}" onclick="pickMulti(${g},'${o}')" ${checked?'disabled':''}>${o}</button>`).join('')}</div></div>`}
html+='</div>';const total=groups.length,correct=groups.filter((_,g)=>multiSelected[g]===(q.answers[g]??'No se aplica')).length;
if(checked)html+=`<div class="feedback ${correct===total?'ok':'no'}"><strong>${correct} de ${total} categorías correctas</strong><p>${q.why}</p>${correct!==total?`<div><strong>Revisa:</strong> ${groups.map((_,g)=>multiSelected[g]===(q.answers[g]??'No se aplica')?'':`${['Identidad','Lo que nombra','Cantidad','Uno o conjunto','Género','Número'][g]} → ${q.answers[g]??'No se aplica'}`).filter(Boolean).join('; ')}.</div>`:''}</div>`;
html+=`<div class="toprow"><span class="muted">Puntos: ${score}</span>${checked?`<button class="btn" onclick="nextFinal()">${index===finalWords.length-1?'Terminar misión':'Siguiente palabra →'}</button>`:`<button class="btn" onclick="checkFinal()" ${Object.keys(multiSelected).length<6?'disabled':''}>Comprobar clasificación</button>`}</div>`;el.innerHTML=html}
function pickMulti(g,o){if(checked)return;multiSelected[g]=o;renderFinal()}
function checkFinal(){if(Object.keys(multiSelected).length<6)return;checked=true;score+=groups.filter((_,g)=>multiSelected[g]===(finalWords[index].answers[g]??'No se aplica')).length;renderFinal()}
function nextFinal(){if(index<finalWords.length-1){index++;checked=false;multiSelected={};renderFinal();return}unlocked=Math.max(unlocked,missions.length+1);sessionStorage.setItem('sust_unlocked',unlocked);el.innerHTML=`<h2>🏅 Expediente maestro completado</h2><p>Has analizado ${finalWords.length} sustantivos en seis categorías cada uno.</p><div class="word">${score} / ${finalWords.length*6}</div><div class="toprow"><button class="btn secondary" onclick="start(${missions.length})">Repetir misión</button><button class="btn" onclick="renderHome()">Ver expedientes →</button></div>`}
function next(){if(index<missions[stage].items.length-1){index++;selected=null;checked=false;render();return}if(stage===unlocked&&unlocked<missions.length){unlocked++;sessionStorage.setItem('sust_unlocked',unlocked)}const all=unlocked>=missions.length;el.innerHTML=`<h2>📁 Expediente completado</h2><p>Has terminado <strong>${missions[stage].name}</strong>.</p><div class="word">${score} / ${missions[stage].items.length}</div><p>${all?'¡Has desbloqueado el Expediente maestro!' :'Ya puedes continuar con el siguiente expediente.'}</p><div class="toprow"><button class="btn secondary" onclick="start(${stage})">Repetir</button><button class="btn" onclick="renderHome()">Ver expedientes →</button></div>`}renderHome();
</script></body></html>
